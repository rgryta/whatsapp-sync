# An example, not a deployment: the shape the two services expect — one image, two
# commands, two database roles. Pin a version rather than `latest` if you would rather
# decide when it moves. Secrets go in `.env` beside it (see `.env.example`); roles and
# grants are in `deploy/provision-whatsapp-db.sql`.
#
# `whatsapp-client` adopts an existing WAHA (Baileys) session on its first start, so no
# re-pairing. WAHA and `whatsapp-client` are then the same WhatsApp device: never run both.

services:
  whatsapp-client:
    labels:
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
    image: ghcr.io/rgryta/whatsapp-sync:latest
    container_name: whatsapp-client
    # The image's default command is the MCP server.
    command: ["whatsapp-client"]
    restart: unless-stopped
    # Already unprivileged; this stops the process gaining anything either, and nothing in
    # here needs a capability.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No env_file: `.env` carries WAHA's key, its dashboard password and the MCP's database
    # password, none of which this process needs. Compose interpolates the one it does.
    environment:
      # The only process with DDL rights. It applies the archive migrations and its own
      # `device` schema (the account's keys, out of the MCP role's reach) at boot.
      WHATSAPP_DSN: postgresql://whatsapp_ingest:${WHATSAPP_INGEST_PASSWORD}@homelab-postgres:5432/whatsapp
      # First start only: the WAHA (Baileys) session to adopt. Ignored once the device is
      # stored, so no re-pairing, ever. WAHA_NOWEB_SESSION is `session_<id>` from `.env`.
      WHATSAPP_IMPORT_FROM: /waha-sessions/noweb/${WAHA_NOWEB_SESSION}
      # Voice notes go to the whisper.cpp server on this network; no model lives here.
      WHATSAPP_WHISPER_URL: http://whisper-cpp:8080
      TZ: Europe/Warsaw
    volumes:
      # Read-only: the import never writes to WAHA's copy, which is the rollback.
      - waha_sessions:/waha-sessions:ro
    networks:
      homelab-network:
        ipv4_address: 172.20.0.92
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  whatsapp-mcp:
    labels:
      # No Traefik route: it has no authentication of its own, and MCPHub reaches it
      # in-network at http://whatsapp-mcp:8000/mcp.
      - traefik.enable=false
      - wud.watch=true
      - wud.watch.digest=true
      - autoheal=true
    image: ghcr.io/rgryta/whatsapp-sync:latest
    container_name: whatsapp-mcp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No env_file, for the same reason as above.
    environment:
      # Read-only role. It cannot create or alter anything, by design.
      WHATSAPP_DSN: postgresql://whatsapp_mcp:${WHATSAPP_MCP_PASSWORD}@homelab-postgres:5432/whatsapp
      WHATSAPP_HOST: 0.0.0.0
      WHATSAPP_PORT: "8000"
      # rmcp's DNS-rebinding guard: the Host headers /mcp answers. MCPHub addresses this
      # by container name. Unset means loopback only, which 403s every call while
      # /healthz stays green.
      WHATSAPP_MCP_ALLOWED_HOSTS: whatsapp-mcp
      TZ: Europe/Warsaw
    command:
      - whatsapp-mcp
    networks:
      homelab-network:
        ipv4_address: 172.20.0.84
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - whatsapp-mcp
        - --health-check
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  waha_sessions:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /mnt/quick/apps/volumes/waha/sessions

networks:
  homelab-network:
    external: true
